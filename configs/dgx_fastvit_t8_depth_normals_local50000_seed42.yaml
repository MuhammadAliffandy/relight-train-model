experiment:
  name: fastvit_t8_fpn_depth_normals_local50000_seed42_v1
  seed: 42
  epochs: 100
  batch_size: 8
  workers: 8
  input_size: [256, 256]
  backbone: fastvit_t8.apple_in1k
  pretrained: true
  fpn_width: 48
  learning_rate: 0.00001
  min_learning_rate: 0.000001
  scheduler: cosine
  weight_decay: 0.0001
  depth_mode: metric
  checkpoint_interval_minutes: 10
  log_interval_steps: 25
  progress_json_interval_steps: 25
  amp: true

data:
  # Same Drive account visible at ~/xxdrive; rclone reads this remote directly for staging.
  rclone_source: xxdrive:AppleCapstoneRelighting/dataset/sources/SynthHuman
  # Shared local store: the existing 30k files are reused and this run adds the 20k new samples.
  # All paths below are relative to the cloned repository on the DGX.
  source_root: ./data/synthhuman_local30000/raw
  expected_samples: 50000
  inventory_dir: ./data/synthhuman_local30000/index

output:
  run_dir: ./runs/fastvit_t8_fpn_depth_normals_local50000_seed42_v1
  backup_remote: ""
