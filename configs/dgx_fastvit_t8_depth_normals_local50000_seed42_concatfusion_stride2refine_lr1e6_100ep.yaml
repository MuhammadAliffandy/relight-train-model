  # layers are initialized with zero output corrections.
  init_checkpoint: ./runs/fastvit_t8_fpn_depth_normals_local50000_seed42_concatfusion_lr2e6_384x512_100ep_v1/best_checkpoint.pt
  learning_rate: 0.000001
  min_learning_rate: 0.0000001
  scheduler: cosine
  weight_decay: 0.0001
  checkpoint_interval_minutes: 10
  log_interval_steps: 25
  progress_json_interval_steps: 25
  amp: true

data:
  rclone_source: xxdrive:AppleCapstoneRelighting/dataset/sources/SynthHuman
  source_root: ./data/synthhuman_local30000/raw
  expected_samples: 50000
  inventory_dir: ./data/synthhuman_local30000/index

