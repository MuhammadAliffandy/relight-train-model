experiment:
  name: fastvit_t8_fpn_depth_normals_local50000_seed42_concatfusion_stride2refine_lr1e6_384x512_100ep_v1
  seed: 42
  epochs: 100
  batch_size: 8
  workers: 8
  input_size: [384, 512]
  backbone: fastvit_t8.apple_in1k
  pretrained: false
  fpn_width: 48
  fpn_fusion: concat
  depth_mode: metric
  decoder_refinement: stride2
  refinement_width: 16
